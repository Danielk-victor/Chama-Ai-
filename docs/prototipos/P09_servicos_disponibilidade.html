<html><head><meta charset='utf-8'><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DejaVu Sans',Arial,sans-serif;background:#F4F7F5;color:#1E2B24;font-size:14px}
:root{--g:#1B7F5C;--gd:#13604A;--a:#F2A541;--l:#E3F1EA;--b:#D5DDD8}
.top{background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:16px}
.top small{font-weight:normal;font-size:12px;opacity:.9}
.wrap{padding:16px}
h1{font-size:20px;line-height:1.25;margin-bottom:6px} h2{font-size:15px;margin:14px 0 8px}
p.sub{color:#51635A;margin-bottom:12px;font-size:13px}
label{display:block;font-size:12px;color:#51635A;margin:10px 0 4px}
.in{width:100%;border:1px solid var(--b);background:#fff;border-radius:8px;padding:11px 12px;font-size:14px;color:#1E2B24;min-height:42px}
.in.ph{color:#8A9A92}
.btn{display:block;text-align:center;background:var(--g);color:#fff;border-radius:10px;padding:13px;font-weight:bold;margin-top:14px}
.btn.sec{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.wa{background:#25D366}
.btn.red{background:#C0392B}
.btn.sm{display:inline-block;padding:8px 14px;margin:8px 6px 0 0;font-size:13px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--l);color:var(--gd);border-radius:16px;padding:6px 11px;font-size:12px}
.chip.on{background:var(--g);color:#fff}
.av{width:46px;height:46px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;flex:none}
.row{display:flex;gap:10px;align-items:center}
.ver{color:var(--g);font-size:12px;font-weight:bold}
.badge{display:inline-block;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:bold}
.b-y{background:#FFF1CC;color:#8A5A00}.b-g{background:#D6F0E0;color:#14663F}.b-r{background:#F9D9D5;color:#9B2C20}.b-gr{background:#E6E9E7;color:#4A5A52}
.muted{color:#6B7B73;font-size:12px}
.price{color:var(--gd);font-weight:bold}
.tab{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:10px 0;font-size:11px;color:#51635A}
.tab b{color:var(--g)}
.steps{display:flex;gap:6px;margin:6px 0 12px}.st{flex:1;height:5px;border-radius:3px;background:var(--b)}.st.on{background:var(--g)}
.seg{display:flex;border:1px solid var(--g);border-radius:10px;overflow:hidden;margin-top:4px}.seg div{flex:1;text-align:center;padding:10px;font-size:13px}.seg .on{background:var(--g);color:#fff;font-weight:bold}
.up{border:2px dashed var(--g);border-radius:12px;background:var(--l);padding:22px 10px;text-align:center;color:var(--gd)}
.ck{display:flex;gap:8px;font-size:12px;color:#51635A;margin-top:12px;line-height:1.4}.ck i{width:18px;height:18px;border:2px solid var(--g);border-radius:4px;flex:none;background:var(--g);color:#fff;font-style:normal;text-align:center;font-size:12px;line-height:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--b)}th{color:#51635A;font-size:12px}
.day{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--b);font-size:13px}
.tog{width:34px;height:18px;border-radius:9px;background:var(--g);position:relative}.tog:after{content:'';position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}.tog.off{background:#C3CCC7}.tog.off:after{right:auto;left:2px}
 body{width:390px;height:780px;position:relative;overflow:hidden}</style></head><body><div class='top'><span>🔧 Chama Aí</span><small>João</small></div><div class='wrap'><h1>Serviços e disponibilidade</h1>
<h2>Meus serviços</h2><div class='card'><div class='day'><span>Instalação de tomadas</span><span class='price'>R$ 80/hora</span></div><div class='day'><span>Troca de fiação</span><span class='price'>R$ 350 fixo</span></div><div class='day' style='border:0'><span class='muted'>+ Adicionar serviço</span></div></div>
<h2>Dias e horários</h2><div class='card'><div class='day'><span>Segunda</span><span class='muted'>8h–17h</span><div class='tog'></div></div><div class='day'><span>Terça</span><span class='muted'>8h–17h</span><div class='tog'></div></div><div class='day'><span>Quarta</span><span class='muted'>8h–17h</span><div class='tog'></div></div><div class='day'><span>Quinta</span><span class='muted'>8h–12h</span><div class='tog'></div></div><div class='day'><span>Sexta</span><span class='muted'>8h–17h</span><div class='tog'></div></div><div class='day'><span>Sábado</span><span class='muted'>—</span><div class='tog off'></div></div><div class='day' style='border:0'><span>Domingo</span><span class='muted'>—</span><div class='tog off'></div></div></div>
<div class='btn'>Salvar</div></div><div class='tab'><span>Painel</span><span><b>Serviços</b></span><span>Conta</span></div></body></html>
